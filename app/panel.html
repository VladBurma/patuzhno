<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>патужно</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#e9f0ff; --text2:#9aa6c8; --muted:#5d6789; --edge:rgba(120,160,255,.14);
  --cyan:#00f0ff; --cyan2:#00a3ff; --mag:#ff2bd6; --mag2:#ff6a3d; --lime:#7dff6a; --amber:#ffb627; --red:#ff3b5c;
  --flow:#7f8cff; --flow2:#4b5bd8;
  --display:"Unbounded",system-ui,sans-serif; --mono:"Onest",system-ui,sans-serif;
}
body.charge{--flow:var(--cyan);--flow2:var(--cyan2)}
body.discharge{--flow:var(--mag);--flow2:var(--mag2)}
*{box-sizing:border-box;margin:0}
html,body{width:380px;height:878px;overflow:hidden;background:transparent;color:var(--text);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;cursor:default}
body{position:relative;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;
  background:radial-gradient(320px 220px at 50% 20%, color-mix(in oklab,var(--flow) 22%, transparent), transparent 70%),
             linear-gradient(180deg, rgba(7,9,22,.94), rgba(5,6,13,.97));transition:background 1s}
.floor{position:absolute;left:-40%;right:-40%;top:300px;height:150px;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(color-mix(in oklab,var(--flow) 40%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--flow) 40%,transparent) 1px,transparent 1px);
  background-size:34px 34px;transform:perspective(300px) rotateX(70deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent 90%);animation:floor 5s linear infinite}
@keyframes floor{to{background-position:0 34px,0 0}}
body>*{position:relative;z-index:1}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* header */
.logo{display:flex;flex-direction:column;justify-content:center}
.logo .lw{width:128px;height:44px;overflow:hidden;margin-left:-2px}
.logo img{height:76px;width:auto;display:block;margin:-16.6px 0 0 -14.2px}
.logo b{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}
.logo small{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}
header{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.16em;text-transform:uppercase}
.brand b{color:var(--flow);text-shadow:0 0 14px var(--flow);transition:color .8s}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.18em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;border:1px solid var(--edge);
  background:rgba(10,14,30,.7);font-size:10.5px;color:var(--text2);white-space:nowrap}
.led{width:7px;height:7px;border-radius:50%;background:var(--flow);box-shadow:0 0 10px var(--flow);animation:pulse 1.6s infinite}
.led.err{background:var(--red);box-shadow:0 0 10px var(--red);animation:none}
@keyframes pulse{50%{opacity:.35}}
.ib{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--text2);
  transition:all .18s}
.ib svg{width:16px;height:16px}
.ib:hover{color:#fff;border-color:color-mix(in oklab,var(--flow) 60%,transparent);box-shadow:0 0 16px -4px var(--flow);background:rgba(255,255,255,.07)}
.ib:active{transform:scale(.94)}

/* hero */
.hero{height:372px;position:relative;margin-top:-4px}
#flow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.node{position:absolute;top:268px;width:96px;text-align:center;z-index:3}
#nGrid{left:2px} #nLoad{right:2px}
.ring{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--muted);
  border:1px solid var(--edge);background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.06), rgba(0,0,0,.25));transition:all .5s}
.ring::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px dashed color-mix(in oklab,var(--flow) 45%,transparent);animation:spin 16s linear infinite}
.ring svg{width:22px;height:22px}
.node.active .ring{color:var(--flow);box-shadow:0 0 26px -6px var(--flow), inset 0 0 18px -8px var(--flow)}
.node.active .ring svg{filter:drop-shadow(0 0 5px var(--flow))}
@keyframes spin{to{transform:rotate(360deg)}}
.node .nm{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.node .vl{font-family:var(--display);font-weight:700;font-size:17px;margin-top:3px;white-space:nowrap}
.node .vl small{font-size:9px;font-weight:500;color:var(--text2)}
.off-t{color:var(--mag);text-shadow:0 0 10px var(--mag)}

.core{position:absolute;left:50%;top:66px;width:400px;height:300px;margin-left:-200px;transform:scale(.64);transform-origin:50% 0;z-index:2;pointer-events:none}
.halo{position:absolute;left:50%;top:52%;width:360px;height:360px;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle, color-mix(in oklab,var(--flow) 32%, transparent), transparent 62%);filter:blur(10px);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.75}}
.orbit{position:absolute;left:50%;top:60%;translate:-50% -50%;width:330px;height:330px;border-radius:50%;border:1.5px solid color-mix(in oklab,var(--flow) 45%,transparent);
  transform:rotateX(74deg);box-shadow:0 0 24px -6px var(--flow)}
.orbit.o2{width:400px;height:400px;opacity:.45;border-style:dashed;animation:spinflat 30s linear infinite}
@keyframes spinflat{from{transform:rotateX(74deg) rotateZ(0)}to{transform:rotateX(74deg) rotateZ(360deg)}}
.scene{position:absolute;inset:0;perspective:1000px}
.cell{position:absolute;left:50%;top:56%;width:0;height:0;transform-style:preserve-3d;animation:sway 10s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateX(-16deg) rotateY(-38deg)}to{transform:rotateX(-16deg) rotateY(38deg)}}
.face{position:absolute;border:2px solid color-mix(in oklab,var(--flow) 60%, transparent);
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.015) 45%, rgba(255,255,255,.05));
  box-shadow:inset 0 0 36px -14px var(--flow), 0 0 22px -12px var(--flow);overflow:hidden;border-radius:10px}
.fr,.bk{width:260px;height:170px;margin:-85px 0 0 -130px}
.lt,.rt{width:150px;height:170px;margin:-85px 0 0 -75px}
.tp,.bt{width:260px;height:150px;margin:-75px 0 0 -130px}
.fr{transform:translateZ(75px)} .bk{transform:rotateY(180deg) translateZ(75px)}
.rt{transform:rotateY(90deg) translateZ(130px)} .lt{transform:rotateY(-90deg) translateZ(130px)}
.tp{transform:rotateX(90deg) translateZ(85px);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02))}
.bt{transform:rotateX(-90deg) translateZ(85px);opacity:.35;box-shadow:0 0 60px 10px color-mix(in oklab,var(--flow) 30%, transparent)}
.liq{position:absolute;left:0;right:0;bottom:0;height:var(--lvl,50%);opacity:.8;
  background:linear-gradient(180deg, color-mix(in oklab,var(--flow) 85%, white 15%), color-mix(in oklab,var(--flow2) 70%, black 30%));
  box-shadow:0 0 30px var(--flow), inset 0 6px 14px rgba(255,255,255,.35);transition:height 1.6s cubic-bezier(.3,.8,.2,1)}
.liq::before{content:"";position:absolute;left:-50%;width:200%;top:-9px;height:18px;border-radius:45%;background:color-mix(in oklab,var(--flow) 60%, white 40%);opacity:.55;animation:wave 3.2s linear infinite}
body.charge .liq::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.25) 14px 16px);animation:rise 1.1s linear infinite}
body.discharge .liq::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.16) 18px 19px);animation:fall 2.4s linear infinite}
@keyframes wave{to{transform:translateX(25%)}} @keyframes rise{to{background-position:0 -32px}} @keyframes fall{to{background-position:0 38px}}
.disp{position:absolute;left:14px;right:14px;top:12px;height:40px;border-radius:7px;z-index:2;background:rgba(4,6,16,.8);border:1px solid color-mix(in oklab,var(--flow) 50%, transparent);
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:inset 0 0 16px -6px var(--flow)}
.disp b{font-family:var(--display);font-size:18px;color:var(--flow);text-shadow:0 0 10px var(--flow)}
.disp span{font-size:9px;letter-spacing:.2em;color:var(--text2)}
.knob{width:18px;height:18px;border-radius:50%;border:2px solid var(--flow);box-shadow:0 0 8px var(--flow)}
.bays{position:absolute;left:14px;right:14px;top:62px;bottom:14px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px;z-index:2}
.bay{border:1px solid rgba(255,255,255,.28);border-radius:6px;background:rgba(4,6,16,.38);display:grid;gap:4px;padding:6px;align-content:center;justify-items:center}
.bay i{display:block;border-radius:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.bay i.on{background:var(--flow);border-color:#fff;box-shadow:0 0 10px var(--flow)}
.bay.dc i.big{width:26px;height:26px;border-radius:50%} .bay.dc i.sm{width:9px;height:9px;border-radius:50%}
.bay.usb{grid-template-columns:1fr 1fr} .bay.usb i{width:18px;height:6px}
.bay.ac{grid-template-columns:1fr 1fr} .bay.ac i{width:22px;height:22px;border-radius:5px}
.vents{position:absolute;inset:18px 16px;z-index:2;background:repeating-linear-gradient(0deg, rgba(255,255,255,.22) 0 2px, transparent 2px 9px);opacity:.55}
.handle{position:absolute;width:210px;height:46px;margin:-131px 0 0 -105px;border:7px solid color-mix(in oklab,var(--flow) 70%, white 10%);
  border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 0 18px -2px var(--flow), inset 0 0 12px -4px var(--flow)}
.handle.h1{transform:translateZ(46px)} .handle.h2{transform:translateZ(-46px)}
.read{position:absolute;left:0;right:0;top:0;text-align:center;z-index:4}
.soc{font-family:var(--display);font-weight:900;font-size:50px;line-height:1;letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff, color-mix(in oklab,var(--flow) 70%, white));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in oklab,var(--flow) 70%, transparent))}
.soc small{font-size:20px;font-weight:500}
.state{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--flow);margin-top:5px;text-shadow:0 0 10px var(--flow);white-space:nowrap}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{position:relative;border-radius:16px;padding:11px 12px;background:rgba(14,18,38,.62);border:1px solid var(--edge);overflow:hidden;
  transition:transform .18s, box-shadow .18s, border-color .18s;min-width:0}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(140deg, color-mix(in oklab,var(--flow) 50%, transparent), transparent 40%, transparent 70%, rgba(255,43,214,.22));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover{transform:translateY(-2px);border-color:color-mix(in oklab,var(--flow) 40%,transparent);box-shadow:0 10px 26px -14px var(--flow)}
.k{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.k svg{width:13px;height:13px;color:var(--flow)}
.k .r{margin-left:auto;letter-spacing:.06em;text-transform:none;color:var(--text2)}
.v{font-family:var(--display);font-weight:700;font-size:21px;margin-top:7px;white-space:nowrap;letter-spacing:-.01em}
.v small{font-size:10px;font-weight:400;font-family:var(--mono);color:var(--text2);letter-spacing:0}
.sub{font-size:10px;color:var(--text2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--lime)} .no{color:var(--red)}
.ports{display:flex;gap:6px;margin-top:8px;color:var(--muted)}
.ports svg{width:15px;height:15px;transition:all .3s}
.ports svg.on{color:var(--flow);filter:drop-shadow(0 0 4px var(--flow))}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--flow2),var(--flow));box-shadow:0 0 10px var(--flow);transition:width 1s}

.track{position:relative;height:18px;border-radius:6px;margin-top:9px;
  background:repeating-linear-gradient(90deg, rgba(125,255,106,.12) 0 calc(100%/24 - 2px), transparent calc(100%/24 - 2px) calc(100%/24))}
.track .off{position:absolute;top:2px;bottom:2px;border-radius:5px;background:repeating-linear-gradient(135deg, rgba(255,43,214,.65) 0 5px, rgba(255,43,214,.3) 5px 10px);box-shadow:0 0 12px -2px var(--mag)}
.track .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;box-shadow:0 0 8px #fff,0 0 16px var(--cyan)}
.hours{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-top:3px}

/* порада */
.tipbar{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 6px;border-radius:13px;border:1px solid color-mix(in oklab,var(--tc) 35%,transparent);
  background:linear-gradient(90deg,color-mix(in oklab,var(--tc) 12%,transparent),rgba(14,18,38,.5));transition:all .18s;cursor:pointer}
.tipbar:hover{box-shadow:0 0 18px -6px var(--tc);border-color:var(--tc)}
.tipbar .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in oklab,var(--tc) 18%,transparent);color:var(--tc);flex:none}
.tipbar .ti svg{width:15px;height:15px}
.tipbar .tt{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.tipbar b{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipbar .tt span{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipbar .chev{width:14px;height:14px;color:var(--muted);flex:none}
.tipbar.open{height:auto;padding:10px 10px 10px 6px;align-items:flex-start}.tipbar.open b,.tipbar.open .tt span{white-space:normal}
.tipbar.alert{--tc:var(--red)} .tipbar.warn{--tc:var(--amber)} .tipbar.info{--tc:var(--cyan)} .tipbar.ok{--tc:var(--lime)}
/* toggles */
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{height:40px;border-radius:13px;border:1px solid var(--edge);background:rgba(14,18,38,.62);display:flex;align-items:center;gap:8px;padding:0 11px;
  color:var(--text2);font-weight:600;font-size:12px;transition:all .2s}
.sw svg{width:16px;height:16px}
.sw .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .3s}
.sw.on{color:#fff;border-color:color-mix(in oklab,var(--lime) 55%,transparent);background:linear-gradient(180deg,rgba(125,255,106,.1),rgba(125,255,106,.03))}
.sw.on .dot{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.sw:hover{border-color:color-mix(in oklab,var(--flow) 55%,transparent);box-shadow:0 0 18px -8px var(--flow)}
.sw:active{transform:scale(.97)}
.sw.busy{opacity:.55}
.sw.arm{border-color:var(--red);box-shadow:0 0 18px -6px var(--red);color:#fff}
.sw.arm .lb::after{content:" вимкн.?";color:var(--red);font-weight:400;font-size:10px}

footer{margin-top:auto;display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid rgba(120,160,255,.09)}
.big{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:11px;border:1px solid color-mix(in oklab,var(--flow) 35%,transparent);
  background:linear-gradient(180deg,color-mix(in oklab,var(--flow) 16%,transparent),rgba(255,255,255,.02));color:#fff;font-weight:600;font-size:12px;transition:all .18s}
.big svg{width:16px;height:16px;color:var(--flow)}
.big:hover{box-shadow:0 0 22px -6px var(--flow);border-color:var(--flow)}
#bSet{margin-left:auto}

/* setup state */
.setup{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:0 20px}
.setup h2{font-family:var(--display);font-size:17px;font-weight:700}
.setup p{color:var(--text2);line-height:1.6;font-size:11.5px}
body.nokey .live{display:none!important} body.nokey .setup{display:flex}
</style>
</head>
<body class="idle">
<div class="floor live"></div>
<header>
  <div class="logo"><div class="lw"><img src="/assets/logo.png" alt="патужно" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'патужно'}))"></div><small id="model" hidden></small></div>
  <div class="pill live"><span class="led" id="led"></span><span id="pill">—</span></div>
  <div class="ib" id="bAcc" title="Акаунт" style="margin-left:6px"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
</header>

<section class="hero live">
  <canvas id="flow"></canvas>
  <div class="node" id="nGrid"><div class="ring"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div class="nm">Мережа</div><div class="vl" id="gridV">—</div></div>
  <div class="core"><div class="halo"></div><div class="orbit"></div><div class="orbit o2"></div>
    <div class="scene"><div class="cell" id="cell">
      <div class="face bk"><div class="liq"></div></div>
      <div class="face lt"><div class="liq"></div><div class="vents"></div></div>
      <div class="face rt"><div class="liq"></div><div class="vents"></div></div>
      <div class="face bt"></div><div class="face tp"></div>
      <div class="handle h1"></div><div class="handle h2"></div>
      <div class="face fr"><div class="liq"></div>
        <div class="disp"><div class="knob"></div><span>OUKITEL</span><b id="mini">--</b></div>
        <div class="bays">
          <div class="bay dc"><i class="big" id="pCar"></i><div style="display:flex;gap:6px"><i class="sm"></i><i class="sm"></i></div></div>
          <div class="bay usb"><i id="pA1"></i><i id="pA2"></i><i id="pC1"></i><i id="pC2"></i><i id="pC3"></i><i id="pC4"></i></div>
          <div class="bay ac"><i class="pAC"></i><i class="pAC"></i><i class="pAC"></i><i class="pAC"></i></div>
        </div></div>
    </div></div></div>
  <div class="node" id="nLoad"><div class="ring"><svg viewBox="0 0 24 24"><path d="M9 2v5M15 2v5"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></svg></div>
    <div class="nm">Пристрої</div><div class="vl" id="loadV">—</div></div>
  <div class="read"><div class="soc" id="soc">--<small>%</small></div><div class="state" id="state">—</div></div>
</section>

<section class="grid live">
  <div class="card"><div class="k"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg><span id="lK">Світло</span></div>
    <div class="v" id="lV">—</div><div class="sub" id="lS"></div></div>
  <div class="card"><div class="k"><svg viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10"/></svg><span id="rK">Вистачить на</span></div>
    <div class="v" id="rV">—</div><div class="sub" id="rS"></div></div>
  <div class="card"><div class="k"><svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Виходи<span class="r" id="oR"></span></div>
    <div class="v" id="oV">—</div><div class="ports" id="ports"></div></div>
  <div class="card"><div class="k"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4"/></svg>Батарея<span class="r" id="tR"></span></div>
    <div class="v" id="bV">—</div><div class="meter"><i id="bM" style="width:0"></i></div></div>
</section>

<section class="card live" style="padding:10px 12px 8px">
  <div class="k"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="gK">Графік</span><span class="r" id="gR"></span></div>
  <div class="track" id="track"></div>
  <div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
</section>

<section class="tipbar live ok" id="tipbar"><span class="ti"><svg viewBox="0 0 24 24" id="tipIc"><path d="M20 6 9 17l-5-5"/></svg></span>
  <div class="tt"><b id="tipT">Батарея в порядку</b><span id="tipX"></span></div><svg viewBox="0 0 24 24" class="chev"><path d="M9 6l6 6-6 6"/></svg></section>

<section class="tg live">
  <div class="sw" data-key="ac"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9.5 10v4M14.5 10v4"/></svg><span class="lb">AC</span><span class="dot"></span></div>
  <div class="sw" data-key="usb"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6" rx="3"/><path d="M8 12h8"/></svg><span class="lb">USB</span><span class="dot"></span></div>
  <div class="sw" data-key="dc"><svg viewBox="0 0 24 24"><path d="M5 17h14l-1.5-6a2 2 0 0 0-2-1.5h-7a2 2 0 0 0-2 1.5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg><span class="lb">12 В</span><span class="dot"></span></div>
</section>

<section class="setup">
  <div class="ring" style="width:64px;height:64px;color:var(--amber)"><svg viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
  <h2>Підключіть станцію</h2>
  <p>Увійдіть в акаунт Wonderfree один раз — програма знайде станцію в домашній мережі й далі працюватиме напряму по Wi-Fi.</p>
  <div class="big" id="bSetup"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Налаштувати</div>
</section>

<footer>
  <div class="big live" id="bDash"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Повний дашборд</div>
  <div class="ib" id="bSet" title="Налаштування"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
  <div class="ib" id="bQuit" title="Вийти з програми"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></div>
</footer>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const hhmm = iso => iso ? iso.slice(11,16) : "—";
const dayPfx = iso => { const d = new Date(iso), t = new Date(); const dd = Math.round((new Date(d.toDateString()) - new Date(t.toDateString()))/864e5);
  return dd===0 ? "" : dd===1 ? "завтра " : d.toLocaleDateString("uk-UA",{day:"numeric",month:"short"})+" "; };
const when = iso => iso ? dayPfx(iso)+hhmm(iso) : "—";
const hm = h => { if (h==null || !isFinite(h)) return "—"; const m = Math.round(h*60); return `${Math.floor(m/60)}<small> год</small> ${pad(m%60)}<small> хв</small>`; };
const mm = m => `${pad(Math.floor(m/60))}:${pad(Math.round(m%60))}`;
const native = cmd => { try { webkit.messageHandlers.app.postMessage(cmd); } catch(e) { if (cmd==="dashboard") location.href="/"; } };
$("bDash").onclick = () => native("dashboard"); $("bSet").onclick = () => native("settings");
$("bAcc").onclick = () => native("account");  $("bQuit").onclick = () => native("quit");
$("bSetup").onclick = () => native("dashboard");

const PI = {
  socket:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9.5 10v4M14.5 10v4"/>',
  usba:'<rect x="5" y="8" width="14" height="8" rx="1.5"/><path d="M8 11h8"/>',
  usbc:'<rect x="4" y="9" width="16" height="6" rx="3"/><path d="M8 12h8"/>',
  car:'<path d="M5 17h14l-1.5-6a2 2 0 0 0-2-1.5h-7a2 2 0 0 0-2 1.5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/>'};
const TI = {peak:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>', battery:'<rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M6 10v4"/>',
  temp:'<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>', calib:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
  slow:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', fast:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  full:'<rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M5 10h12v4H5z"/>', ok:'<path d="M20 6 9 17l-5-5"/>'};
$("tipbar").onclick = () => { if (window.WEB) $("tipbar").classList.toggle("open"); else native("health"); };
const flow = {mode:"idle", inW:0, outW:0};
let pending = {}, pendingAt = {}, armed = null, live = false;

function render(d){
  const st = d.station || {}, setup = d.setup || {};
  document.body.classList.toggle("nokey", !setup.has_key);
  $("model").textContent = setup.model || "Станція";
  const age = st.last_update ? Date.now()/1000 - st.last_update : 1e9;
  live = !!st.connected && age < 120;
  const mode = !d.ready ? "idle" : !d.grid ? "discharge" : d.charging ? "charge" : "idle";
  document.body.className = mode + (setup.has_key ? "" : " nokey");
  flow.mode = live ? mode : "idle"; flow.inW = st.in_w||0; flow.outW = st.out_w||0;
  $("led").className = "led" + (live ? "" : " err");
  $("pill").textContent = !setup.has_key ? "не налаштовано" : !live ? "немає зв'язку" : !d.grid ? "від батареї" : d.charging ? "заряджається" : d.idle ? "очікування" : "режим ДБЖ";
  if (live && st.source === "cloud" && !window.WEB) $("pill").textContent += " · ☁";
  $("pill").title = st.source === "cloud" ? "дані через хмарний сервер" : (st.error || "");
  if (!d.ready) return;

  const soc = Math.round(st.soc);
  $("soc").innerHTML = `${soc}<small>%</small>`; $("mini").textContent = soc + "%";
  document.querySelectorAll(".liq").forEach(e => e.style.setProperty("--lvl", Math.max(3, st.soc) + "%"));
  $("cell").style.animationDuration = (mode==="charge" ? 6 : mode==="discharge" ? 9 : 12) + "s";
  $("state").textContent = mode==="charge" ? `заряд +${Math.max(0,d.net_w)} Вт` + (d.recharge?.full_at && st.soc < 99.5 ? ` · 100% о ${hhmm(d.recharge.full_at)}` : "")
    : mode==="discharge" ? `−${st.out_w} Вт` + (d.runout_at ? ` · до ${when(d.runout_at)}` : "")
    : st.soc >= 99.5 ? "ДБЖ · батарея повна" : "ДБЖ · напряму з мережі";

  $("nGrid").classList.toggle("active", !!d.grid);
  $("gridV").innerHTML = d.grid ? `${st.in_w}<small> Вт</small>` : `<span class="off-t">OFF</span>`;
  $("nLoad").classList.toggle("active", (st.out_w||0) > 0);
  $("loadV").innerHTML = `${st.out_w ?? "—"}<small> Вт</small>`;

  // світло
  if (!d.grid){
    $("lK").textContent = "Світло дадуть";
    $("lV").innerHTML = d.power_on_at ? when(d.power_on_at) : "невідомо";
    $("lS").innerHTML = d.budget ? `можна ~${d.budget.avg_w} Вт ${d.budget.enough ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'}` : "графіка немає";
  } else {
    const r = d.recharge || {};
    $("lK").textContent = r.next_off ? "Вимкнуть" : "Світло є";
    $("lV").innerHTML = r.next_off ? when(r.next_off) : "без планів";
    $("lS").innerHTML = r.next_off ? `буде ~${r.soc_at_off}% ${r.ok ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'}` : (st.soc >= 99.5 ? "батарея повна" : `100% о ${when(r.full_at)}`);
  }
  // вистачить
  const cur = (d.scenarios||[]).find(s => s.current) || (d.scenarios||[])[0];
  const hrs = (d.usable_wh && d.now_w) ? d.usable_wh / Math.max(1, d.now_w) : cur?.hours;
  $("rK").textContent = d.grid ? "Без світла вистачить" : "Вистачить на";
  $("rV").innerHTML = hm(hrs);
  $("rS").textContent = `при ~${d.now_w ?? cur?.w ?? "—"} Вт` + (d.runout_at && !d.grid ? ` · до ${hhmm(d.runout_at)}` : "");
  // виходи
  const a = st.usb_a || [0,0], c = st.usb_c || [0,0,0,0], ac = st.ac_out_w ?? st.out_w ?? 0, car = st.dc_out_w || 0;
  const pl = [["socket",ac,3],["usba",a[0],2],["usba",a[1],2],["usbc",c[0],2],["usbc",c[1],2],["usbc",c[2],2],["usbc",c[3],2],["car",car,2]];
  const act = pl.filter(p => p[1] > p[2]).length;
  $("oV").innerHTML = `${st.out_w ?? 0}<small> Вт</small>`; $("oR").textContent = act ? `${act} акт.` : "";
  $("ports").innerHTML = pl.map(([i,v,t]) => `<svg viewBox="0 0 24 24" class="${v>t?'on':''}">${PI[i]}</svg>`).join("");
  [["pA1",a[0]],["pA2",a[1]],["pC1",c[0]],["pC2",c[1]],["pC3",c[2]],["pC4",c[3]],["pCar",car]].forEach(([id,v])=>$(id).classList.toggle("on", v>2));
  document.querySelectorAll(".pAC").forEach(e=>e.classList.toggle("on", ac>3));
  // батарея
  $("bV").innerHTML = `${((d.usable_wh||0)/1000).toFixed(2)}<small> кВт·год</small>`;
  $("tR").textContent = st.temp != null ? `${st.temp} °C` : "";
  $("bM").style.width = Math.max(2, st.soc) + "%";
  // графік
  const sc = d.schedule || {}, day = sc.ok ? sc.today : null, nm = new Date().getHours()*60 + new Date().getMinutes();
  $("gK").textContent = sc.group ? `Графік · ${sc.group}` : "Графік";
  $("gR").textContent = !sc.ok ? "недоступний" : d.next_off ? `${when(d.next_off[0])}–${hhmm(d.next_off[1])}` : "без відключень";
  $("track").innerHTML = (day ? day.off.map(([x,y]) => `<div class="off" style="left:${x/14.4}%;width:${(y-x)/14.4}%"></div>`).join("") : "") + `<div class="now" style="left:${nm/14.4}%"></div>`;
  // порада
  const tp = (d.health && d.health.tips || [])[0];
  if (tp){ const tb = $("tipbar"); tb.className = "tipbar live " + tp.level;
    $("tipT").textContent = tp.title; $("tipX").textContent = tp.text;
    $("tipIc").innerHTML = TI[tp.icon] || TI.ok;
    const n = d.health.tips.filter(t => t.level !== "ok").length; if (n > 1) $("tipT").textContent += `  · ще ${n-1}`; }
  // перемикачі
  const on = {ac:st.ac_on, usb:st.usb_on, dc:st.dc_on};
  document.querySelectorAll(".sw").forEach(el => { const k = el.dataset.key;
    if (pending[k] !== undefined && (pending[k] === on[k] || Date.now() - (pendingAt[k] || 0) > 20000)) delete pending[k];
    el.classList.toggle("on", !!on[k]); el.classList.toggle("busy", pending[k] !== undefined || !live); });
}

async function load(){ if (window.PAUSED) return; try { const r = await fetch("/api/state", {cache:"no-store"}); render(await r.json()); } catch(e) {} }
document.querySelectorAll(".sw").forEach(el => el.onclick = async () => {
  const key = el.dataset.key, isOn = el.classList.contains("on");
  if (key === "ac" && isOn && armed !== "ac"){ armed = "ac"; el.classList.add("arm");
    setTimeout(()=>{ if (armed==="ac"){ armed=null; el.classList.remove("arm"); } }, 4000); return; }
  armed = null; el.classList.remove("arm");
  pending[key] = !isOn; pendingAt[key] = Date.now(); el.classList.toggle("on", !isOn); el.classList.add("busy");
  const r = await fetch("/api/control",{method:"POST",body:JSON.stringify({key, value:!isOn})}).catch(()=>null);
  if (!r || !r.ok) delete pending[key];
  setTimeout(load, 250); setTimeout(load, 1400);
});
window.refresh = load;
load(); setInterval(load, window.WEB ? 10000 : 2000);   // телефон — раз на 10 с; у програмі опитування ставиться на паузу, коли панель закрита

/* частинки енергії: мережа → станція → пристрої */
const cv = $("flow"), cx = cv.getContext("2d"); let parts = [], acc = {}, lastT = performance.now();
function size(){ const r = cv.getBoundingClientRect(), k = devicePixelRatio||1; cv.width = r.width*k; cv.height = r.height*k; cx.setTransform(k,0,0,k,0,0); }
size(); addEventListener("resize", size);
const G = {x:50, y:296}, K = {x:190, y:174}, L = {x:330, y:296};
function bez(a,b,t){ const up = a.y > b.y, mx = up ? a.x : b.x, my = up ? b.y : a.y, u=1-t; return {x:u*u*a.x+2*u*t*mx+t*t*b.x, y:u*u*a.y+2*u*t*my+t*t*b.y}; }
function tick(now){
  const dt = Math.min(.05, (now-lastT)/1000); lastT = now; cx.clearRect(0,0,380,380);
  const col = getComputedStyle(document.body).getPropertyValue("--flow").trim() || "#7f8cff";
  const legs = [];
  if (flow.mode === "charge") legs.push({id:"g",a:G,b:K,ra:36,rb:96,rate:flow.inW},{id:"l",a:K,b:L,ra:96,rb:36,rate:flow.outW});
  else if (flow.mode === "discharge") legs.push({id:"l",a:K,b:L,ra:96,rb:36,rate:flow.outW});
  else legs.push({id:"g",a:G,b:K,ra:36,rb:96,rate:Math.max(flow.inW,flow.outW)},{id:"l",a:K,b:L,ra:96,rb:36,rate:flow.outW});
  const vis = (Lg,p) => Math.max(0, Math.min(1, (Math.hypot(p.x-Lg.a.x,p.y-Lg.a.y)-Lg.ra)/18, (Math.hypot(p.x-Lg.b.x,p.y-Lg.b.y)-Lg.rb)/18));
  for (const Lg of legs){ cx.beginPath(); let s=false;
    for (let t=0;t<=1.001;t+=.02){ const p = bez(Lg.a,Lg.b,t); if (vis(Lg,p)<=0){s=false;continue;} s ? cx.lineTo(p.x,p.y) : cx.moveTo(p.x,p.y); s=true; }
    cx.strokeStyle = col; cx.globalAlpha = .22; cx.lineWidth = 1.5; cx.setLineDash([3,5]); cx.stroke(); cx.setLineDash([]); cx.globalAlpha = 1;
    if (Lg.rate > 0){ acc[Lg.id] = (acc[Lg.id]||0) + (3 + Math.min(16, Lg.rate/50))*dt;
      while (acc[Lg.id] >= 1){ acc[Lg.id]--; parts.push({lid:Lg.id, t:0, v:.35 + Math.min(.6, Lg.rate/2500), s:.7 + Math.random()*.6}); } } }
  const ids = legs.map(l=>l.id); parts = parts.filter(p => ids.includes(p.lid) && p.t <= 1);
  cx.globalCompositeOperation = "lighter";
  for (const p of parts){ const Lg = legs[ids.indexOf(p.lid)]; p.t += p.v*dt; const q = bez(Lg.a,Lg.b,p.t), a = vis(Lg,q); if (a<=0) continue;
    const r = 6*p.s, g = cx.createRadialGradient(q.x,q.y,0,q.x,q.y,r);
    g.addColorStop(0,"rgba(255,255,255,.95)"); g.addColorStop(.35,col); g.addColorStop(1,"transparent");
    cx.globalAlpha = a; cx.fillStyle = g; cx.beginPath(); cx.arc(q.x,q.y,r,0,7); cx.fill(); }
  cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
